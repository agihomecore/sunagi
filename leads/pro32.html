<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRO.32 — Стоматология в Нур-Султане</title>
<style>
  :root{
    --blue:#1c3f8f;
    --blue-dark:#102659;
    --light:#eef3fb;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI',Arial,sans-serif;color:#1a1a1a;background:#fff;line-height:1.6;}
  .hero{
    background:linear-gradient(135deg,var(--blue) 0%,var(--blue-dark) 100%);
    color:#fff;padding:64px 24px 56px;text-align:center;
  }
  .hero .logo{font-size:38px;font-weight:800;letter-spacing:2px;}
  .hero .logo span{color:#9fd5ff;}
  .hero p{margin-top:14px;font-size:18px;opacity:.92;max-width:520px;margin-left:auto;margin-right:auto;}
  .hero a.cta{
    display:inline-block;margin-top:28px;background:#fff;color:var(--blue-dark);
    padding:14px 32px;border-radius:30px;text-decoration:none;font-weight:700;font-size:16px;
  }
  section{padding:48px 24px;max-width:760px;margin:0 auto;}
  h2{color:var(--blue-dark);font-size:24px;margin-bottom:18px;text-align:center;}
  .services{background:var(--light);}
  .services ul{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:600px;margin:0 auto;}
  .services li{background:#fff;border-radius:12px;padding:18px;text-align:center;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.06);}
  .discount{text-align:center;}
  .discount .tiers{display:flex;justify-content:center;gap:18px;margin-top:18px;flex-wrap:wrap;}
  .discount .tier{background:var(--blue);color:#fff;border-radius:50%;width:84px;height:84px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;}
  .contact{background:var(--light);text-align:center;}
  .contact .row{margin:8px 0;font-size:17px;}
  .contact a{color:var(--blue-dark);font-weight:700;text-decoration:none;}
  footer{text-align:center;padding:24px;font-size:13px;color:#888;}
  @media(max-width:480px){.services ul{grid-template-columns:1fr;}}
  .cwrap{max-width:600px;margin:0 auto;}
  .cbox{background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:12px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.06);}
  .chdr{padding:14px 18px;border-bottom:1px solid rgba(0,0,0,.06);display:flex;align-items:center;gap:10px;background:var(--light);}
  .cav{width:36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;}
  .cname{font-weight:700;font-size:14px;color:#222;}
  .cstat{font-size:10px;color:var(--blue);letter-spacing:1px;}
  .cnew{margin-left:auto;background:none;border:1px solid rgba(0,0,0,.12);color:#666;border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;}
  .cnew:hover{border-color:var(--blue);color:var(--blue);}
  #chat-msgs{height:300px;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:#fff;}
  .msg{max-width:82%;padding:10px 13px;border-radius:12px;font-size:14px;line-height:1.55;}
  .msg.bot{background:var(--light);align-self:flex-start;border-radius:4px 12px 12px 12px;}
  .msg.user{background:var(--blue);color:#fff;align-self:flex-end;border-radius:12px 4px 12px 12px;}
  .mnm{font-size:9px;letter-spacing:1px;color:var(--blue);text-transform:uppercase;margin-bottom:3px;}
  .typing{display:flex;gap:4px;align-items:center;padding:4px 0;}
