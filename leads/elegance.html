<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elegance Men's Shop — мужская одежда и обувь, Астана</title>
<style>
  :root{
    --black:#0d0d0d;
    --cyan:#19c6d8;
    --light:#f4f4f4;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI',Arial,sans-serif;color:#1a1a1a;background:#fff;line-height:1.6;}
  .hero{
    background:linear-gradient(135deg,var(--black) 0%,#222 100%);
    color:#fff;padding:64px 24px 56px;text-align:center;
  }
  .hero .logo{font-size:40px;font-weight:800;letter-spacing:3px;text-transform:uppercase;}
  .hero .logo span{color:var(--cyan);}
  .hero .sub{font-size:14px;letter-spacing:4px;text-transform:uppercase;opacity:.7;margin-top:6px;}
  .hero p{margin-top:18px;font-size:18px;opacity:.92;max-width:520px;margin-left:auto;margin-right:auto;}
  .hero a.cta{
    display:inline-block;margin-top:28px;background:var(--cyan);color:#0d0d0d;
    padding:14px 32px;border-radius:30px;text-decoration:none;font-weight:700;font-size:16px;
  }
  section{padding:48px 24px;max-width:760px;margin:0 auto;}
  h2{color:var(--black);font-size:24px;margin-bottom:18px;text-align:center;}
  .info{background:var(--light);text-align:center;}
  .info ul{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:600px;margin:0 auto;}
  .info li{background:#fff;border-radius:12px;padding:18px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.06);}
  .contact{text-align:center;}
  .contact .row{margin:8px 0;font-size:17px;}
  .contact a{color:#0d0d0d;font-weight:700;text-decoration:none;border-bottom:2px solid var(--cyan);}
  footer{text-align:center;padding:24px;font-size:13px;color:#888;background:var(--black);color:#aaa;}
  @media(max-width:480px){.info ul{grid-template-columns:1fr;}}
  .cwrap{max-width:600px;margin:0 auto;}
  .cbox{background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:12px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.06);}
  .chdr{padding:14px 18px;border-bottom:1px solid rgba(0,0,0,.06);display:flex;align-items:center;gap:10px;background:var(--light);}
  .cav{width:36px;height:36px;border-radius:50%;background:var(--black);color:var(--cyan);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;}
  .cname{font-weight:700;font-size:14px;color:#222;}
  .cstat{font-size:10px;color:var(--cyan);letter-spacing:1px;}
  .cnew{margin-left:auto;background:none;border:1px solid rgba(0,0,0,.12);color:#666;border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;}
  .cnew:hover{border-color:var(--cyan);color:var(--black);}
  #chat-msgs{height:300px;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:#fff;}
  .msg{max-width:82%;
