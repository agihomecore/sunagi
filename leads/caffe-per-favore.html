<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caffè Per Favore — Italian Coffee, Astana</title>
<style>
  :root{
    --brown:#6b4226;
    --cream:#fbf3e7;
    --gold:#c08a3e;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI',Arial,sans-serif;color:#3a2a1d;background:#fff;line-height:1.6;}
  .hero{
    background:linear-gradient(135deg,var(--brown) 0%,#3a2716 100%);
    color:#fbf3e7;padding:64px 24px 56px;text-align:center;
  }
  .hero .logo{font-size:36px;font-weight:800;font-style:italic;}
  .hero .sub{font-size:14px;letter-spacing:3px;text-transform:uppercase;opacity:.75;margin-top:8px;}
  .hero p{margin-top:18px;font-size:18px;opacity:.95;max-width:520px;margin-left:auto;margin-right:auto;}
  .hero a.cta{
    display:inline-block;margin-top:28px;background:var(--gold);color:#2b1c10;
    padding:14px 32px;border-radius:30px;text-decoration:none;font-weight:700;font-size:16px;
  }
  section{padding:48px 24px;max-width:760px;margin:0 auto;}
  h2{color:var(--brown);font-size:24px;margin-bottom:18px;text-align:center;}
  .offer{background:var(--cream);text-align:center;}
  .offer .badge{
    display:inline-block;background:var(--brown);color:#fff;font-size:28px;font-weight:800;
    border-radius:50%;width:96px;height:96px;line-height:96px;margin-bottom:16px;
  }
  .menu{text-align:center;}
  .menu ul{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:600px;margin:0 auto;}
  .menu li{background:var(--cream);border-radius:12px;padding:18px;font-weight:600;}
  .contact{background:var(--cream);text-align:center;}
  .contact .row{margin:8px 0;font-size:17px;}
  footer{text-align:center;padding:24px;font-size:13px;color:#888;}
  @media(max-width:480px){.menu ul{grid-template-columns:1fr;}}
  .cwrap{max-width:600px;margin:0 auto;}
  .cbox{background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:12px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.06);}
  .chdr{padding:14px 18px;border-bottom:1px solid rgba(0,0,0,.06);display:flex;align-items:center;gap:10px;background:var(--cream);}
  .cav{width:36px;height:36px;border-radius:50%;background:var(--brown);color:#fbf3e7;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;}
  .cname{font-weight:700;font-size:14px;color:#3a2a1d;}
  .cstat{font-size:10px;color:var(--gold);letter-spacing:1px;}
  .cnew{margin-left:auto;background:none;border:1px solid rgba(0,0,0,.12);color:#6b4226;border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;}
  .cnew:hover{border-color:var(--gold);color:var(--brown);}
  #chat-msgs{height:300px;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:#fff;}
